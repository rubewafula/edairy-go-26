services:
  backend:
    image: ghcr.io/rubewafula/edairy-backend:{{EDAIRY_VERSION}}
    container_name: {{SLUG}}-backend
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/storage:/app/storage
    ports:
      - "{{API_PORT}}:{{API_PORT}}"
    environment:
      PORT: {{API_PORT}}
      DB_HOST: host.docker.internal
      GIN_MODE: release
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    image: ghcr.io/rubewafula/edairy-frontend:{{EDAIRY_VERSION}}
    container_name: {{SLUG}}-frontend
    restart: unless-stopped
    ports:
      - "{{UI_PORT}}:80"
    volumes:
      - ./runtime-config.js:/usr/share/nginx/html/runtime-config.js:ro
    depends_on:
      backend:
        condition: service_healthy
